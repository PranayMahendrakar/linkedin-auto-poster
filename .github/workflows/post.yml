name: LinkedIn Auto-Poster

on:
  # Scheduled: 9 AM and 6 PM IST (3:30 AM and 12:30 PM UTC)
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 12 * * *'  # 6:00 PM IST

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      post_count:
        description: 'Number of posts to publish (default: 1)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Thumbnails are stored as SVG; LinkedIn only takes PNG/JPG/GIF.
      - name: Install the SVG renderer and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          sudo apt-get install -y -qq fonts-inter || echo "::warning::fonts-inter unavailable; thumbnails fall back to DejaVu Sans"

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          COUNT=${{ github.event.inputs.post_count || '1' }}
          for i in $(seq 1 $COUNT); do
            echo "--- Posting $i of $COUNT ---"
            python post_next.py
            if [ "$i" -lt "$COUNT" ]; then
              echo "Waiting 60 seconds before next post..."
              sleep 60
            fi
          done

      - name: Commit progress
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add post_progress.json
          git diff --staged --quiet || git commit -m "Update post progress [skip ci]"
          # The writers push new posts to this repo too. If one landed while
          # this run was posting, a plain push is rejected, progress is lost,
          # and the next run posts the same thing again.
          for attempt in 1 2 3 4; do
            if git pull --rebase --quiet && git push --quiet; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push post_progress.json. The next run will repeat this post unless it is pushed."
          exit 1
