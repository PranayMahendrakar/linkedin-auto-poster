name: Research Writer

# Claude writes the post text for the next research papers,
# keeping about a week written ahead (research/drafts/). Runs early each
# morning; drafts are kept a week ahead, so the 07:00 IST post always has one. Up to 3 papers a run.
#
# Secret: CLAUDE_CODE_OAUTH_TOKEN, the same one the news writer uses.

on:
  schedule:
    - cron: '23 23 * * *'    # 04:53 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Write the drafts but do not save them'
        type: boolean
        default: false

concurrency:
  group: research-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          # Claude reads paper text in a later step; keep the push token out
          # of .git/config. The save step gets it through GIT_CONFIG_* instead.
          persist-credentials: false

      - name: Fail early if the Claude token is missing
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token' and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r research/requirements.txt

      - name: Pick the papers and fetch their text
        id: prep
        run: python -m research.writer prepare

      - uses: actions/setup-node@v4
        if: steps.prep.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Install Claude Code
        if: steps.prep.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Write the drafts
        if: steps.prep.outputs.skip != 'true'
        working-directory: research
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          rc=0
          # One line on purpose: a wrapped string would carry this file's
          # indentation into the prompt.
          claude -p "Follow the instructions in RESEARCH_RUN.md exactly. You are running unattended on Ubuntu. Read out/context.md first, then read each paper's full text and write one JSON draft per paper to out/drafts/ as the brief describes. Never send a push notification." \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit,Glob,Grep" \
            2>&1 | tee out/claude-output.txt || rc=$?
          if ! ls out/drafts/*.json >/dev/null 2>&1; then
            echo "::error::No drafts were written (claude exit $rc)"
            exit 1
          fi
          [ "$rc" = 0 ] || echo "::warning::claude exited $rc but wrote drafts"

      - name: Check and save the drafts
        if: steps.prep.outputs.skip != 'true'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          b64=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$b64"
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64"
          export GIT_CONFIG_KEY_1='user.name'
          export GIT_CONFIG_VALUE_1='github-actions[bot]'
          export GIT_CONFIG_KEY_2='user.email'
          export GIT_CONFIG_VALUE_2='github-actions[bot]@users.noreply.github.com'
          if [ "$DRY_RUN" = "true" ]; then
            python -m research.writer append --dry-run
          else
            python -m research.writer append
          fi

      - name: Keep the output
        if: always() && steps.prep.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: research-writer-${{ github.run_id }}
          path: |
            research/out/context.md
            research/out/drafts/
            research/out/claude-output.txt
          retention-days: 7
          if-no-files-found: warn
