    <text x="80" y="380" font-size="88" font-weight="800" fill="#F5F7FA">like <tspan fill="#94A3B8">2B.</tspan></text>

    <text x="80" y="520" font-size="88" font-weight="800" fill="#F5F7FA">Stores</text>
    <text x="80" y="635" font-size="112" font-weight="800" fill="#F5F7FA">like <tspan fill="#F59E0B">24B.</tspan></text>

    <text x="80" y="770" font-size="36" font-weight="500" fill="#94A3B8">On-device AI is decided by gigabytes,</text>
    <text x="80" y="818" font-size="36" font-weight="500" fill="#94A3B8">not the <tspan fill="#F5F7FA" font-weight="700">"active parameters" headline.</tspan></text>

    <!-- memory block: 16 cells stored, 1 active -->
    <rect x="760" y="420" width="240" height="240" rx="18" fill="none" stroke="#F59E0B" stroke-width="5"/>
    <g fill="#F59E0B" fill-opacity="0.22">
      <rect x="772" y="432" width="48" height="48" rx="6"/>
      <rect x="828" y="432" width="48" height="48" rx="6"/>
      <rect x="884" y="432" width="48" height="48" rx="6"/>
      <rect x="940" y="432" width="48" height="48" rx="6"/>
      <rect x="772" y="488" width="48" height="48" rx="6"/>
      <rect x="884" y="488" width="48" height="48" rx="6"/>
      <rect x="940" y="488" width="48" height="48" rx="6"/>
      <rect x="772" y="544" width="48" height="48" rx="6"/>
      <rect x="828" y="544" width="48" height="48" rx="6"/>
      <rect x="884" y="544" width="48" height="48" rx="6"/>
      <rect x="940" y="544" width="48" height="48" rx="6"/>
      <rect x="772" y="600" width="48" height="48" rx="6"/>
