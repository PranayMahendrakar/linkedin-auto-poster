    <text x="880" y="404" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="2" fill="#F59E0B">24B IN MEMORY</text>
    <text x="880" y="700" font-size="24" font-weight="600" text-anchor="middle" fill="#94A3B8">~2B active per token</text>

    <rect x="80" y="944" width="64" height="6" rx="3" fill="#F59E0B"/>
    <text x="80" y="1000" font-size="26" font-weight="700" letter-spacing="3" fill="#94A3B8">PRANAY MAHENDRAKAR</text>
