<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111A2E"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.25"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<circle cx="800" cy="800" r="320" fill="url(#glow)"/>
<rect x="80" y="64" width="400" height="56" rx="28" fill="none" stroke="#F59E0B" stroke-width="3"/>
<text x="110" y="101" font-family="Inter, DejaVu Sans, sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#F59E0B">AI TOKEN COSTS</text>
<g font-family="Inter, DejaVu Sans, sans-serif" font-weight="800">
<text x="80" y="290" font-size="100" fill="#F5F7FA">Scores: once.</text>
<text x="80" y="420" font-size="100" fill="#F59E0B">Tokens: forever.</text>
</g>
<g font-family="Inter, DejaVu Sans, sans-serif" font-size="38" fill="#94A3B8">
<text x="80" y="540">Cost is set by tokens per task,</text>
<text x="80" y="595">not the best-case score.</text>
<text x="80" y="650" font-weight="700" fill="#F5F7FA">Re-measure, don't re-platform.</text>
</g>
<g fill="#F59E0B">
<rect x="620" y="820" width="40" height="70" opacity="0.35"/>
<rect x="680" y="780" width="40" height="110" opacity="0.5"/>
<rect x="740" y="740" width="40" height="150" opacity="0.7"/>
<rect x="800" y="700" width="40" height="190"/>
</g>
<rect x="80" y="944" width="64" height="6" fill="#F59E0B"/>
<text x="80" y="1000" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" letter-spacing="3" fill="#94A3B8">PRANAY MAHENDRAKAR</text>
</svg>
