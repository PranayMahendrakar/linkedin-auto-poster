<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="800" cy="820" r="260" fill="url(#glow)"/>

  <g font-family="Inter, DejaVu Sans, sans-serif">
    <rect x="80" y="92" width="372" height="56" rx="28" fill="none" stroke="#10B981" stroke-width="3"/>
    <text x="112" y="129" font-size="25" font-weight="700" letter-spacing="3" fill="#10B981">OPEN ARABIC LLMS</text>

    <text x="80" y="310" font-size="128" font-weight="800" fill="#F5F7FA">Fluent</text>
    <text x="80" y="450" font-size="128" font-weight="800" fill="#F5F7FA"><tspan fill="#10B981">≠</tspan> correct.</text>

    <text x="80" y="550" font-size="36" font-weight="500" fill="#94A3B8">Jais 3 shipped 24 Arabic benchmarks</text>
    <text x="80" y="598" font-size="36" font-weight="500" fill="#94A3B8">alongside its six open models.</text>
    <text x="80" y="660" font-size="40" font-weight="700" fill="#F5F7FA">The test set is the product.</text>

    <!-- model sizes, 900M to 375B -->
    <line x1="590" y1="900" x2="990" y2="900" stroke="#1E293B" stroke-width="3"/>
    <g fill="#10B981">
      <rect x="600" y="870" width="44" height="30" rx="6" fill-opacity="0.35"/>
      <rect x="664" y="850" width="44" height="50" rx="6" fill-opacity="0.47"/>
      <rect x="728" y="820" width="44" height="80" rx="6" fill-opacity="0.6"/>
      <rect x="792" y="785" width="44" height="115" rx="6" fill-opacity="0.73"/>
      <rect x="856" y="745" width="44" height="155" rx="6" fill-opacity="0.86"/>
      <rect x="920" y="700" width="44" height="200" rx="6"/>
    </g>
    <text x="622" y="938" font-size="22" font-weight="600" text-anchor="middle" fill="#94A3B8">900M</text>
    <text x="942" y="938" font-size="22" font-weight="600" text-anchor="middle" fill="#94A3B8">375B</text>

    <rect x="80" y="944" width="64" height="6" rx="3" fill="#10B981"/>
    <text x="80" y="1000" font-size="26" font-weight="700" letter-spacing="3" fill="#94A3B8">PRANAY MAHENDRAKAR</text>
  </g>
</svg>
